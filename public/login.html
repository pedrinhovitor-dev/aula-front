<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Central Empresas</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>
    <header class="header-login">
        <img src="logo.png" alt="Central Empresas">
    </header>
    <main class="area-login">

        <section class="boas-vindas">
        <h1>Bem-vindo à Central Empresas!</h1>
            <p>
                Faça login para acessar nossos serviços e
                soluções exclusivas para sua empresa.
            </p>
        </section>

        <section class="card-login">
            <h2>Acesso à Plataforma</h2>
            <p>Entre com suas credenciais para continuar.</p>

            <form id="form-login">

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">
                <button type="submit">Entrar</button>
                <p id="mensagem-erro"></p>
            </form>
        </section>
    </main>

</body>
</html>
